version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healthcare_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data

  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "3001:3001"
    depends_on:
      - kafka
      - postgres
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_sync
      KAFKA_BROKERS: kafka:29092
      DD_AGENT_HOST: ""
      NODE_ENV: development

  ui-ehr:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_CONFIG: vite.config.ehr.ts
    ports:
      - "5173:5173"
    depends_on:
      - service
    environment:
      VITE_API_URL: http://localhost:3001

  ui-hr:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_CONFIG: vite.config.hr.ts
    ports:
      - "5174:5174"
    depends_on:
      - service
    environment:
      VITE_API_URL: http://localhost:3001

  ui-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_CONFIG: vite.config.dashboard.ts
    ports:
      - "5175:5175"
    depends_on:
      - service
    environment:
      VITE_API_URL: http://localhost:3001

  # Uncomment to enable Datadog (requires DD_API_KEY env var)
  # datadog-agent:
  #   image: gcr.io/datadoghq/agent:7
  #   environment:
  #     DD_API_KEY: ${DD_API_KEY}
  #     DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
  #   ports:
  #     - "8125:8125/udp"

volumes:
  pgdata:
